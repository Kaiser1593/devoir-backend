{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Bibliothèque{% endblock %} — Bibliothèque</title>
  <link rel="stylesheet" href="{% static 'catalogue/css/style.css' %}">
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="{% url 'accueil' %}">📚 Bibliothèque</a>
      <a href="{% url 'livre-list' %}">Livres</a>
      <a href="{% url 'auteur-list' %}">Auteurs</a>
      <a href="{% url 'adherent-list' %}">Adhérents</a>
      <a href="{% url 'emprunt-list' %}">Emprunts</a>
      <span class="spacer"></span>
      <a href="{% url 'import' %}">Import</a>
      <a href="{% url 'export-json' %}">Export JSON</a>
      <a href="{% url 'export-xml' %}">Export XML</a>
      <a href="/api/">API</a>
    </nav>
  </header>
  <main>
    <div id="messages">
      {% for message in messages %}
        <p class="message {{ message.tags }}">{{ message }}</p>
      {% endfor %}
    </div>
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'catalogue/js/app.js' %}"></script>
</body>
</html>
