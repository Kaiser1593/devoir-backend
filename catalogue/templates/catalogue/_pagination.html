{% if is_paginated %}
<p class="pagination" id="pagination">
  {% if page_obj.has_previous %}<a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}">← Précédent</a>{% endif %}
  Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}
  {% if page_obj.has_next %}<a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}">Suivant →</a>{% endif %}
</p>
{% endif %}
