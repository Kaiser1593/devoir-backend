{% extends 'catalogue/base.html' %}
{% block title %}Auteurs{% endblock %}
{% block content %}
<div class="toolbar"><h1>Auteurs</h1><a class="btn" href="{% url 'auteur-create' %}">+ Nouvel auteur</a></div>
<table>
  <thead><tr><th>Nom</th><th>Nationalité</th><th>Livres</th><th></th></tr></thead>
  <tbody>
  {% for a in object_list %}
    <tr>
      <td>{{ a }}</td><td>{{ a.nationalite|default:"—" }}</td><td>{{ a.nb_livres }}</td>
      <td><a href="{% url 'auteur-update' a.pk %}">Modifier</a> · <a href="{% url 'auteur-delete' a.pk %}">Supprimer</a></td>
    </tr>
  {% empty %}<tr><td colspan="4">Aucun auteur.</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
