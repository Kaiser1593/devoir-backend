{% extends "stock/base.html" %}
{% block content %}
<h1>{{ titre }}</h1>
<form method="post" class="card" {% if multipart %}enctype="multipart/form-data"{% endif %}>
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <div class="form-row">
      {{ field.label_tag }} {{ field }} {{ field.errors }}
    </div>
  {% endfor %}
  <button class="btn">Enregistrer</button>
  <a class="btn sec" href="{% url retour %}">Annuler</a>
</form>
{% endblock %}
