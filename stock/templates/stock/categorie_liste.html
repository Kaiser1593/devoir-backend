{% extends "stock/base.html" %}
{% block content %}
<h1>Catégories</h1>
<div class="toolbar"><span class="spacer"></span><a class="btn" href="{% url 'categorie_creer' %}">+ Catégorie</a></div>
<div class="table-wrap"><table>
  <thead><tr><th>Nom</th><th>Description</th><th>Produits</th><th></th></tr></thead>
  <tbody>
  {% for c in categories %}
    <tr><td>{{ c.nom }}</td><td>{{ c.description }}</td><td>{{ c.produits.count }}</td>
        <td><a href="{% url 'categorie_supprimer' c.pk %}">Supprimer</a></td></tr>
  {% empty %}<tr><td colspan="4">Aucune catégorie.</td></tr>{% endfor %}
  </tbody>
</table></div>
{% endblock %}
