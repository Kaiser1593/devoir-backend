<div class="table-wrap"><table>
  <thead><tr><th>Date</th><th>Produit</th><th>Type</th><th>Qté</th><th>Commentaire</th></tr></thead>
  <tbody>
  {% for m in mouvements %}
    <tr>
      <td>{{ m.date|date:"d/m/Y H:i" }}</td>
      <td><a href="{{ m.produit.get_absolute_url }}">{{ m.produit.nom }}</a></td>
      <td class="{% if m.type == 'E' %}entree{% else %}sortie{% endif %}">{{ m.get_type_display }}</td>
      <td>{{ m.quantite }}</td><td>{{ m.commentaire }}</td>
    </tr>
  {% empty %}<tr><td colspan="5">Aucun mouvement.</td></tr>{% endfor %}
  </tbody>
</table></div>
