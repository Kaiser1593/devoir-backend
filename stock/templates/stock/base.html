<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gestion de stock{% endblock %}</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --ink:#1c2430; --muted:#6b7686; --accent:#2457d6; --warn:#c2410c; --ok:#15803d; --line:#e2e6ec; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    nav { background:var(--ink); padding:0 16px; display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
    nav a { color:#d8dee8; text-decoration:none; padding:14px 12px; }
    nav a:hover { color:#fff; background:#2b3647; }
    nav .brand { color:#fff; font-weight:700; margin-right:12px; }
    main { max-width:1000px; margin:24px auto; padding:0 16px; }
    h1 { margin:0 0 16px; font-size:24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
    .stat b { display:block; font-size:26px; }
    .stat span { color:var(--muted); }
    table { width:100%; border-collapse:collapse; background:var(--card); }
    th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; font-size:13px; }
    .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
    .btn { display:inline-block; background:var(--accent); color:#fff; border:0; padding:8px 14px; border-radius:6px; text-decoration:none; cursor:pointer; font:inherit; }
    .btn.sec { background:#e8ecf3; color:var(--ink); }
    .btn.danger { background:#b91c1c; }
    .badge { padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; }
    .badge.alerte { background:#ffedd5; color:var(--warn); }
    .badge.ok { background:#dcfce7; color:var(--ok); }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
    .toolbar .spacer { flex:1; }
    input, select, textarea { font:inherit; padding:7px 9px; border:1px solid #c5ccd8; border-radius:6px; max-width:100%; }
    .messages { list-style:none; padding:0; margin:0 0 16px; }
    .messages li { padding:10px 14px; border-radius:6px; margin-bottom:6px; background:#dcfce7; }
    .messages li.error { background:#fee2e2; }
    .form-row { margin-bottom:12px; } .form-row label { display:block; font-weight:600; margin-bottom:3px; }
    .errorlist { color:#b91c1c; list-style:none; padding:0; margin:3px 0; }
    .entree { color:var(--ok); font-weight:600; } .sortie { color:var(--warn); font-weight:600; }
  </style>
</head>
<body>
<nav>
  <a class="brand" href="{% url 'tableau_de_bord' %}">📦 Stock</a>
  <a href="{% url 'produit_liste' %}">Produits</a>
  <a href="{% url 'categorie_liste' %}">Catégories</a>
  <a href="{% url 'mouvement_liste' %}">Mouvements</a>
  <a href="/api/">API</a>
  <a href="/admin/">Admin</a>
</nav>
<main>
  {% if messages %}<ul class="messages">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
